<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#3F2E80" />
      <stop offset="0.52" stop-color="#241C4A" />
      <stop offset="1" stop-color="#110E22" />
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#A896FF" stop-opacity="0.48" />
      <stop offset="0.55" stop-color="#7C6BF2" stop-opacity="0.1" />
      <stop offset="1" stop-color="#7C6BF2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.6" stop-color="#F3F1FF" />
      <stop offset="1" stop-color="#D9D3FF" />
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E7EFF" />
      <stop offset="0.55" stop-color="#6654E8" />
      <stop offset="1" stop-color="#3F27B5" />
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08060F" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />

  <!-- 后层卡片：暗示多版本 / 素材堆叠 -->
  <rect x="246" y="76" width="180" height="180" rx="48"
        fill="#ffffff" fill-opacity="0.09"
        stroke="#ffffff" stroke-opacity="0.24" stroke-width="2" />

  <!-- 主卡片：当前画面，居中 -->
  <rect x="126" y="126" width="260" height="260" rx="62"
        fill="url(#card)" filter="url(#drop)" />

  <!-- 播放三角（圆角） -->
  <path d="M 232 202 L 304 256 L 232 310 Z"
        fill="url(#play)" stroke="url(#play)"
        stroke-width="22" stroke-linejoin="round" />

  <!-- 时间轴：极淡的一笔，小尺寸下不干扰 -->
  <rect x="204" y="344" width="104" height="10" rx="5"
        fill="#6654E8" fill-opacity="0.18" />
</svg>
