<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 16/24 px 专用：这个尺寸下"卡片里嵌三角"会糊成色块，
       改为深底 + 放大的白色三角，靠极端对比保证可辨。 -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#4A3696" />
      <stop offset="0.55" stop-color="#2A2158" />
      <stop offset="1" stop-color="#15112B" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <path d="M 134 136 L 394 256 L 134 376 Z"
        fill="#ffffff" stroke="#ffffff"
        stroke-width="40" stroke-linejoin="round" />
</svg>
